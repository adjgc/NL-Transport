services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    container_name: mysql_nltransport
    environment:
      MYSQL_DATABASE: nl_transport
      MYSQL_USER: ${MYSQL_USER:-nltransport}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nltransport_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nltransport_root_dev}
    ports:
        - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - nl-transport-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nl-transport:latest
    restart: unless-stopped
    container_name: nl_transport_app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nl_transport?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-nltransport}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-nltransport_dev}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport
    ports:
      - "${APP_PUBLISHED_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  nl-transport-data:
