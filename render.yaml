services:
  - type: pserv
    name: nl-transport-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.4
    plan: starter
    region: oregon
    autoDeployTrigger: "off"
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: nl_transport
      - key: MYSQL_USER
        value: nltransport
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: nl-transport
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: MYSQL_HOSTPORT
        fromService:
          name: nl-transport-mysql
          type: pserv
          property: hostport
      - key: MYSQL_DATABASE
        value: nl_transport
      - key: SPRING_DATASOURCE_USERNAME
        value: nltransport
      - key: SPRING_DATASOURCE_PASSWORD
        fromService:
          name: nl-transport-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
