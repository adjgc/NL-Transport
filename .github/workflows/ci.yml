name: NL Transport CI
run-name: Deploy a producción - @${{ github.actor }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nl-transport-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-image:
    name: Tests y build de imagen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: transport/pom.xml

      - name: Ejecutar tests
        run: bash ./transport/mvnw --batch-mode --no-transfer-progress -f transport/pom.xml clean verify

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen de producción
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nl-transport:ci
