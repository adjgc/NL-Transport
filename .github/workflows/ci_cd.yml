name: CI/CD a Producción
run-name: CI/CD a Producción - @${{ github.actor }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-produccion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-code:
    name: Validar código
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: transport/pom.xml

      - name: Compilar código
        run: bash ./transport/mvnw --batch-mode --no-transfer-progress -f transport/pom.xml clean compile

  validate-tests:
    name: Validar tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: transport/pom.xml

      - name: Ejecutar tests
        run: bash ./transport/mvnw --batch-mode --no-transfer-progress -f transport/pom.xml clean test

  validate-compose:
    name: Validar imágenes Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Validar configuración de Docker Compose
        run: docker compose --file compose.yml config --quiet

      - name: Descargar imágenes externas
        run: docker compose --file compose.yml pull postgres

      - name: Construir imagen de la aplicación
        run: docker compose --file compose.yml build --pull app

  publish-image:
    name: Publicar imagen en Docker Hub
    needs:
      - validate-code
      - validate-tests
      - validate-compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Validar credenciales de Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Falta el secreto DOCKERHUB_USERNAME."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Falta el secreto DOCKERHUB_TOKEN."; exit 1; }

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            adjgc/nl_transport:latest
            adjgc/nl_transport:${{ github.sha }}
          cache-from: type=gha,scope=nl-transport
          cache-to: type=gha,mode=max,scope=nl-transport

  deploy-render:
    name: Desplegar imagen en Render
    needs:
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar Deploy Hook de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "::error::Falta el secreto RENDER_DEPLOY_HOOK."; exit 1; }

      - name: Solicitar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

  notify-failure:
    name: Notificar resultado de CI/CD
    if: always()
    needs:
      - validate-code
      - validate-tests
      - validate-compose
      - publish-image
      - deploy-render
    runs-on: ubuntu-latest
    steps:
      - name: Publicar resultado
        env:
          CODE_RESULT: ${{ needs.validate-code.result }}
          TESTS_RESULT: ${{ needs.validate-tests.result }}
          COMPOSE_RESULT: ${{ needs.validate-compose.result }}
          IMAGE_RESULT: ${{ needs.publish-image.result }}
          DEPLOY_RESULT: ${{ needs.deploy-render.result }}
        shell: bash
        run: |
          {
            echo "## Resultado de CI/CD a Producción"
            echo
            echo "| Validación | Resultado |"
            echo "| --- | --- |"
            echo "| Código | ${CODE_RESULT} |"
            echo "| Tests | ${TESTS_RESULT} |"
            echo "| Docker Compose | ${COMPOSE_RESULT} |"
            echo "| Publicar en Docker Hub | ${IMAGE_RESULT} |"
            echo "| Solicitar despliegue en Render | ${DEPLOY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CODE_RESULT" != "success" || "$TESTS_RESULT" != "success" || "$COMPOSE_RESULT" != "success" || "$IMAGE_RESULT" != "success" || "$DEPLOY_RESULT" != "success" ]]; then
            echo "::error title=CI/CD a Producción rechazado::Falló una validación, la publicación en Docker Hub o la solicitud de despliegue en Render."
            exit 1
          fi
